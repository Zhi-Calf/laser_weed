gnss_driver:
  ros__parameters:
    # NAV3120 的 ttyS9 同时输出 INSPVAA 和 GNGGA。
    serial_port: "/dev/ttyS9"
    baud_rate: 115200
    input_protocol: "inspvaa_gga"
    frame_id: "gnss_link"

    # INSPVAA 提供融合位置、速度和姿态；GGA 只更新卫星数与 RTK 固定状态。
    gga_timeout_sec: 1.5
    giavp_timeout_sec: 1.0
    use_gps_timestamp: true
    gps_utc_leap_seconds: 18

    # 以下参数与 gnss_driver.yaml 保持独立；部署时按现场原点与安装参数修改。
    origin_lat: 34.6198653
    origin_lon: 112.4497271
    origin_alt: 100.0
    heading_std_deg: 0.2
    acc_rtk_fixed: 0.02
    acc_rtk_float: 0.3
    acc_rtd: 1.0
    acc_spp: 1.5
    calib_offset_x: 0.5
    calib_offset_y: 0.0
    calib_offset_heading: 0.0

    debug_giavp: false
    gnss_log_interval: 50
    pose_log_interval: 10
    log_dir: "/opt/agri/logs"
    log_file_size_mb: 5
    log_file_count: 10
    log_enable_console: true
    log_level: "info"
