# 千寻 SDK 差分客户端节点配置
# 千寻 SDK 差分: 上位机读接收机 GGA -> SDK 认证 -> 上传 GGA -> SDK 回调收 RTCM 写回串口。
# 与 ntrip_client 为二选一的替代方案 (由 bringup 的 diff_mode 决定)。
# 顶层键必须与 launch/节点名 sdk_client 一致。
sdk_client:
  ros__parameters:
    # 串口 (接收机的串口)
    serial_port: "/dev/ttyUSB1"
    serial_baud: 115200

    # 千寻 SDK 账号 (DSK 密钥)
    sdk_key: ""
    sdk_secret: ""
    dev_id: ""
    dev_type: ""

    # SDK 1.29 服务器配置 (默认域名已关闭, 必须通过 init 的 serv_conf 传入)
    # 官方加密服务端口示例: OpenAPI 8443, OSS 8008; 非加密端口为 8000/8007。
    sdk_openapi_host: "openapi.qxwz.com"
    sdk_openapi_port: 8443
    sdk_oss_host: "oss.qxwz.com"
    sdk_oss_port: 8008

    # NOSR 坐标框架/历元: frame 1=ITRF2008, 2=WGS84, 3=CGCS2000; epoch 格式 "年.月"
    # 若差分服务要求其他历元, 按服务端实际坐标系修改。
    sdk_coord_frame: 2
    sdk_coord_epoch: "2005.0"

    # 行为
    gga_interval_sec: 1.0             # GGA 上传周期 (s)
    sdk_reconnect_delay_sec: 1.0      # SDK 会话重建延迟 (s); 串口打开/等待 GGA 等本地重试固定 200ms
    first_gga_timeout_sec: 30.0       # 等待首个 GGA 超时 (s), 接收机无输出超过该时长判异常
    first_rtcm_timeout_sec: 30.0      # 等待首帧 RTCM 超时 (s), 差分服务未挂载超过该时长判异常
    sdk_auth_timeout_sec: 10.0        # SDK 认证回调超时 (s), 认证回调迟迟未到则重连
    coordsys_timeout_sec: 1.0         # 设置坐标系回调超时 (s), 回调迟迟未到则按超时处理
    gga_timeout_sec: 30.0             # GGA 停摆超时 (s), 持续无新 GGA 判停摆 (接收机可能因信号差短暂停发, 较宽容)
    rtcm_timeout_sec: 10.0            # RTCM 停摆超时 (s), 差分断流判停摆 (需尽快重连, 较严格)
    serial_write_fail_count: 10       # 串口写 RTCM 连续失败帧数阈值, 达到才上报 FAULT_SERIAL_WRITE (与帧率解耦)
    sdk_transient_error_max: 20       # SDK 瞬时错误累计上限, 达到则判差分链路质量持续差, 重建会话并上报 FAULT_SDK_ERROR

    # spdlog 滚动日志
    log_dir: "/opt/agri/logs"   # 日志目录
    log_file_size_mb: 5         # 单个日志文件大小上限 (MB)
    log_file_count: 10          # 滚动保留的文件数量
    log_enable_console: true    # 是否输出到终端
    log_level: "info"           # 日志级别: trace, debug, info, warn, error, critical
