path_tracker:
  ros__parameters:
    # ============================================================
    # spdlog 日志（与 global_path_planner 保持一致）
    # ============================================================
    # 支持 ~ 和 $VAR 展开；目录不可写时回退到 $ROS_HOME/logs
    # 或 ~/.ros/logs。
    log_dir: "/opt/agri/logs"
    log_file_size_mb: 50
    log_file_count: 10
    log_enable_console: true
    log_level: "info"

    # ============================================================
    # LQR 控制器
    # 以下参数全部写入 LQRConfig，集中定义控制器几何、分段、
    # 权重、求解器和速度策略。
    # ============================================================
    # 控制频率同时决定 LQR 离散周期和节点调度周期。
    control_hz: 10.0

    # 真实前后轴距 (m)。控制器按转向模式自动选择 L 或 L/2 作为等效轴距。
    # 填错会直接导致横向跟踪振荡或收敛过慢。
    # 默认值与 Laser-Weeding-Sim 的 Isaac 底盘一致。
    wheelbase: 1.521

    # 根据 global_path_planner 的 waypoint_types 自动切换模式：
    # WORK(0) 使用单阿克曼，TURN(1) 使用对称阿克曼。
    # 进入掉头区前和离开掉头区后的模式保持距离（米）。
    turn_mode_enter_m: 0.6
    turn_mode_exit_m: 0.6

    # 转向角协议上限 ±90°。
    max_steer_deg: 90.0

    # 转角指令变化率上限 (°/s)，用于抑制 LQR 输出跳变和 WORK/TURN
    # 转向模式切换时的等效转角突变。必须按转向执行器能力现场标定。
    max_steer_rate_deg_s: 90.0

    # 目标点最大前向搜索点数（路径点数，非米）。每拍从上一次的目标索引开始，
    # 在 [上一目标点, 上一目标点 + snap_forward_points] 内搜索离车最近的点。
    #
    # 为什么需要：只靠弧长累积推进的话，目标点完全信任里程计——打滑、被推、
    # 里程计跳变都会让它和车越走越远，且没有任何机制拉回来。
    # 搜索**从上一最近点开始**，所以索引单调不减，吸附永远不会把目标点拉回
    # 已完成的路径，否则弓字形作业会重跑已覆盖的垄。
    # 20 点 × path_resolution 0.2m = 4m。该参数必须为正。
    snap_forward_points: 20

    # 参数名沿用 MegaTrak path_controller.yaml，调参经验可迁移。
    # 注意 R 的语义变了：履带项目里是"角速度代价"，这里是"转向角代价"，
    # 所以同一组数值的表现会不同，需要重新标定（见 README 调参一节）。
    lqr_eps: 0.000001
    lqr_max_iteration: 1000
    lqr_Q_lateral: 50.0        # 横向误差权重
    lqr_Q_heading: 25.0        # 航向误差权重
    lqr_R_steer: 25.0          # 转向角控制代价
    # GNSS 位姿固定为车体几何中心。
    # 单阿克曼时自动换算到后轴；
    # 双阿克曼仍使用车体中心。
    pose_at_vehicle_center: true

    # ============================================================
    # 稻行 PID 与双阿克曼 LQR 混合跟踪
    # ============================================================
    # 关闭时保持原有全局路径 LQR 行为。开启后，普通行内优先跟踪视觉
    # 稻行中心线；进入弯道前指定距离改用全局路径行内直线 PID；
    # TURN 段仍使用全局路径 LQR 和双阿克曼。
    row_pid_enabled: false
    crop_row_topic: /crop_row/observation
    crop_row_frame_id: base_link
    crop_row_timeout_s: 0.3
    crop_row_min_confidence: 0.5
    row_pid_pre_turn_m: 3.0
    row_pid_resume_frames: 3
    row_pid_lookahead_m: 1.0

    # 保守初值，只用于联调起点，必须按实车响应重新标定。
    row_pid_kp_rad_per_m: 0.4
    row_pid_ki_rad_per_m_s: 0.02
    row_pid_kd_rad_s_per_m: 0.08
    row_pid_heading_gain: 0.3
    row_pid_derivative_tau_s: 0.15
    row_pid_integral_limit_rad: 0.1

    # 路径分段速度（米/秒），始终启用。
    work_speed_m_s: 0.6
    turn_speed_m_s: 0.3
    # 提前进入低速区的距离和离开掉头区后的低速保持距离。
    turn_speed_preview_m: 1.0
    turn_speed_hold_m: 0.5

    # ============================================================
    # 节点运行参数
    # ============================================================
    # 速度指令加速度限制（m/s²）。
    speed_ramp_mps2: 0.5

    # ============================================================
    # 话题名（与 gnss_localization / global_path_planner 对齐）
    # ============================================================
    pose_topic: /gnss_driver/pose
    path_topic: /global_path_planner/path
    work_mode_topic: /work_mode
    velocity_planner_status_topic: /velocity_planner/status
    # 速度 + 前轮转角合并指令（weeder_msgs/ChassisCmd）
    cmd_topic: /chassis/cmd

    # ============================================================
    # RViz 可视化
    # ============================================================
    frame_id: odom
    viz: true

    # ============================================================
    # 安全门控
    # ============================================================
    # Pose.valid 由 gnss_driver 给出：只有 RTK 固定解为 true。
    # path_tracker 不读取协方差，无效位姿直接输出停车。

    # 横向误差门限 (m)：车辆相对路径的横向偏差超过此值即停车。
    max_lateral_error_m: 0.3

    # 偏离距离门限 (m)：车与当前跟踪目标点的欧氏距离超过此值即停车。
    #
    # ⚠️ 这道门是**必需的**，不是可选优化。LQR 的状态量只有 [横向误差, 航向误差]，
    # **没有沿路径方向的误差项**——车如果沿着路径自己的方向笔直冲过目标点，
    # 两个误差都恰好为 0，控制器会认为"完美跟踪"并继续给全速零转角。
    # 2026-10-15 仿真实测：目标点冻结在起点，车跑出 238 m，steer_angle_rad=2.4e-14，
    # 全程没有任何告警。这道门是唯一能发现该情况的手段。
    #
    # 取值：要大于地头掉头时目标点与车的合法最大间距（默认 path_resolution=0.2m、
    # snap_forward_points=20 → 前向搜索范围 4m，所以 3.0m 是安全的），又要远小于"已经跑出田块"
    # 的距离。该参数必须为正，配置时需人工保证。
    max_track_error_m: 3.0

    # 输入数据超时统一为 1 秒，超过后立即输出停车。
    pose_timeout_s: 1.0
    path_timeout_s: 1.0

    # 工作模式门控：与 global_path_planner、gnss_driver 共用同一条系统级
    # /work_mode 总线（weeder_msgs/WorkMode，由 APP 或模式管理方持续发布）。
    # path_tracker 使用普通订阅 QoS。只有 MODE_UNMANNED(1) 才接管底盘；
    # 手动(0)/标定(2) 或信号超时都停车。
    # 发布端必须以 >= 1/work_mode_timeout_s Hz 持续发布；用 --once 发一次会在
    # work_mode_timeout_s 后被判超时并停车。台架调试用：
    #   ros2 topic pub -r 1 /work_mode weeder_msgs/msg/WorkMode \
    #       "{mode: 1, mode_name: unmanned}"
    work_mode_timeout_s: 1.0

    # 点云避停门控。实车默认启用：无避停状态、状态超时或 sensor_valid=false
    # 时均按失效停车。无雷达仿真必须在 launch 中显式关闭。
    require_velocity_planner: true
    velocity_planner_status_timeout_s: 1.0
