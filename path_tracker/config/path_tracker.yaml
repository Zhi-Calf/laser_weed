path_tracker:
  ros__parameters:
    # 所有参数仅在节点启动时读取，运行中修改不会重新配置控制器。

    # ============================================================
    # 日志
    # ============================================================
    # 支持 ~ 和 $VAR 展开；目录不可写时回退到 $ROS_HOME/logs
    # 或 ~/.ros/logs。
    log_dir: "/opt/agri/logs"
    log_file_size_mb: 50
    log_file_count: 10
    log_enable_console: true
    log_level: "info"

    # ============================================================
    # 节点调度与输出限幅
    # ============================================================
    # 同时决定节点调用频率和 LQR 离散周期，必须大于 0。
    control_hz: 10.0

    # 转角指令变化率上限 (deg/s)，必须大于 0；
    # 非法值会在启动时告警并回退为 90 deg/s。
    max_steer_rate_deg_s: 90.0

    # 最终选中速度指令的变化率上限 (m/s²)，必须大于 0。
    speed_ramp_mps2: 0.5

    # ============================================================
    # 车辆几何与坐标约定
    # ============================================================
    # 真实前后轴距 (m)，必须大于 0。单阿克曼使用 L，
    # 双阿克曼使用 L/2 作为等效轴距。
    wheelbase: 1.521

    # GNSS 位姿位于车体几何中心。单阿克曼控制时换算到后轴，
    # 双阿克曼控制时直接使用几何中心。
    pose_at_vehicle_center: true

    # ============================================================
    # GlobalPathLocator
    # ============================================================
    # GlobalPathLocator 使用下面的前视/保持距离选择 PathWorkMode，
    # 同时决定 LQR 的单/双阿克曼模式。
    turn_mode_enter_m: 0.6
    turn_mode_exit_m: 0.6

    # 每拍从上一命中点开始，在有限索引窗口内选择距离最近的离散路径点。
    # 参数单位是路径点索引步而非米，必须大于 0；搜索索引只前进不后退。
    #
    # 默认 8 个索引步。按 path_resolution=0.2m 估算，前向范围约为 1.6m。
    # WORK 模式下还会在中心锚点附近搜索后轴目标点。
    forward_point_window: 8

    # 当前位姿到路径终点的欧氏距离不超过此值 (m) 时判定到达终点。
    goal_reached_distance_m: 1.0

    # ============================================================
    # LQR 目标速度、求解、权重与限幅
    # ============================================================
    # PathWorkMode 由 GlobalPathLocator 决定，LQR 根据模式选择目标速度。
    work_speed_m_s: 0.6
    turn_speed_m_s: 0.3

    # 参数名沿用 MegaTrak path_controller.yaml，但 R 表示转向角代价，
    # 不再是履带模型的角速度代价，因此数值需要重新标定。
    lqr_eps: 0.000001
    lqr_max_iteration: 1000
    lqr_Q_lateral: 50.0        # 横向误差权重
    lqr_Q_heading: 25.0        # 航向误差权重
    lqr_R_steer: 25.0          # 转向角控制代价

    # 前轮转角协议上限 (deg)，由 LQR 统一限制，必须大于 0。
    max_steer_deg: 90.0

    # ============================================================
    # 视觉稻行
    # ============================================================
    # 关闭时只跟踪全局路径。开启后，普通行内优先跟踪视觉稻行；
    # TURN 前预览或后保持窗口内切回全局路径。
    row_vision_enabled: false

    # 视觉观测超时 (s)，必须大于 0。
    crop_row_timeout_s: 0.3

    # ============================================================
    # 安全门控
    # ============================================================
    # 横向误差超过此值 (m) 时输出停车。
    max_lateral_error_m: 0.3

    # 车辆几何中心到最近路径点的距离超过此值 (m) 时输出停车。
    # 该门控用于发现 LQR 沿路径方向的跟踪丢失，必须大于合法前向搜索范围。
    max_track_error_m: 3.0

    # 输入数据超时 (s)，超过后立即输出停车。
    pose_timeout_s: 1.0
    path_timeout_s: 1.0

    # 只有 MODE_UNMANNED 才接管底盘；手动模式、标定模式或超时均停车。
    # 发布端必须以不低于 1/work_mode_timeout_s Hz 的频率持续发布。
    work_mode_timeout_s: 1.0

    # 实车默认启用点云避停门控。避停状态缺失、超时或无效时均停车；
    # 无雷达仿真需在 launch 中显式关闭。
    require_velocity_planner: true
    velocity_planner_status_timeout_s: 1.0

    # ============================================================
    # RViz 可视化
    # ============================================================
    frame_id: odom
    viz: true
