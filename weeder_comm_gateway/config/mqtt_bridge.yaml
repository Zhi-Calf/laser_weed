mqtt_bridge_node:
  ros__parameters:
    # ------------------------------------------------------------------
    # 设备身份 (FarmDevice v1, robot-cloud docs/IoT接口文档.md §1.3 / §2.2)
    #   MQTT topic 前缀 = /sys/{product_key}/{device_name}
    #   client_id = {product_key}.{device_name}, username = {device_name}&{product_key},
    #   password = HMAC-SHA256(device_secret, ...) —— 由节点按 §2.2 公式计算
    # 下面是平台的专用联调设备; 其他设备必须用平台分配给自己的身份。
    # ------------------------------------------------------------------
    product_key: "tractor_v1"
    device_name: "robot_001"
    device_id: "111"               # 平台设备编号 (字符串形式的正整数, 无前导零)
    # ⚠ 不要把真实 secret 提交进仓库: 写进机器上单独的 yaml, 用 mqtt_bridge_config_file 指过去。
    #   空 -> 匿名连接, 只适合本机 mosquitto 联调 (robot-cloud 网关会拒绝)。
    device_secret: ""

    # ------------------------------------------------------------------
    # MQTT broker (MQTT 3.1.1, clean session)
    #   dev 网关: 1.94.199.140:11883
    # ------------------------------------------------------------------
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_keepalive_s: 60           # 与平台模拟器一致
    mqtt_tls_ca_file: ""           # CA 证书路径; 空 -> 不用 TLS (目标环境明确提供 TLS 时才填)
    mqtt_reconnect_min_s: 1        # 断线重连退避: 1, 2, 4 ... 封顶 max
    mqtt_reconnect_max_s: 10

    # ------------------------------------------------------------------
    # 上行频率与时效
    # ------------------------------------------------------------------
    telemetry_rate_hz: 1.0         # TELEMETRY 发布频率 (Hz); 平台模拟器 WAN 为 1 Hz
    # 遥测数据过期时间 (s): GNSS / 底盘超过这么久没新数据, 对应字段整体省略,
    # 而不是把最后一帧当成当前状态发给平台。
    data_timeout_s: 1.0

    # /work_mode 续发频率 (Hz, 下限 1)。MODE_SET 是单发指令, 而 path_controller /
    # calibration_manager 3 s 收不到 /work_mode 就停车, 所以连着网关期间由本节点续发。
    work_mode_rate_hz: 2.0

    # 服务应答超时 (s): 设备内部 ROS 服务这么久不回, COMMAND_ACK 回 FAILED / TIMEOUT。
    service_timeout_s: 5.0

    # ------------------------------------------------------------------
    # spdlog 滚动日志
    # ------------------------------------------------------------------
    log_dir: "/home/asd/logs"      # 日志目录 (不可写时退回 ~/.ros/logs)
    log_file_size_mb: 50           # 单个日志文件大小上限 (MB)
    log_file_count: 10             # 滚动保留的文件数量
    log_enable_console: true       # 是否输出到终端
    log_level: "info"              # 日志级别: trace, debug, info, warn, error, critical
