http_bridge_node:
  ros__parameters:
    # ------------------------------------------------------------------
    # HTTP 服务
    # ------------------------------------------------------------------
    bind_address: "0.0.0.0"        # 监听地址; 只给本机用填 "127.0.0.1"
    port: 8080                     # 配了证书时一般用 8443
    # https: 证书与私钥都给了才启用, 否则按 http 运行。
    tls_cert_file: ""
    tls_key_file: ""
    # 鉴权: 非空时所有请求必须带 "Authorization: Bearer <auth_token>", 否则 401。
    # ⚠ 不要把真实 token 提交进仓库: 现场用机器上单独的 yaml 覆盖。
    auth_token: ""

    # ------------------------------------------------------------------
    # 路径文件
    # ------------------------------------------------------------------
    # 上传 / 下载的路径文件保存到这里 (原子替换)。让规划器加载它仍需 APP 调 MQTT 的 set_source,
    # 且 path_file 参数填同一个路径。
    path_file: "/opt/agri/test.json"
    max_body_mb: 20                # 上传 / 下载的文件大小上限 (MB)
    download_timeout_s: 30.0       # POST /path/download 的整体超时 (s)

    # ------------------------------------------------------------------
    # spdlog 滚动日志
    # ------------------------------------------------------------------
    log_dir: "/home/asd/logs"      # 日志目录 (不可写时退回 ~/.ros/logs)
    log_file_size_mb: 50           # 单个日志文件大小上限 (MB)
    log_file_count: 10             # 滚动保留的文件数量
    log_enable_console: true       # 是否输出到终端
    log_level: "info"              # 日志级别: trace, debug, info, warn, error, critical
