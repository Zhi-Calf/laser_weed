weeder_chassis:
  ros__parameters:
    # CAN 总线
    can_interface: "vcan0"        # vcan0 = 仿真/台架虚拟总线, can0 = 实车

    # 控制指令
    cmd_topic: "/chassis/cmd"  # 速度 + 前轮转角合并指令 (weeder_msgs/ChassisCmd)
    cmd_timeout_s: 0.3             # 超过该时长未收到新指令 -> 清零停车

    # spdlog 滚动日志
    log_dir: "/opt/agri/logs"     # 目录不可写时自动回退到 $ROS_HOME/logs
    log_file_size_mb: 50          # 单个日志文件大小上限 (MB)
    log_file_count: 10            # 滚动保留的文件数量
    log_enable_console: true      # 是否同时输出到终端
    log_level: "info"             # 日志级别: trace, debug, info, warn, error, critical
