%YAML:1.0
---
schema_version: 1
# Deliberately disabled. Set to 1 only after measuring the homography and scale.
calibration_valid: 0
output_width: 640
output_height: 800
meters_per_pixel: 0.01
vehicle_origin_u: 320.
vehicle_origin_v: 799.
image_to_bev: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1., 0., 0., 0., 1., 0., 0., 0., 1. ]
# Optional geometry settings; this does not accept/validate the calibration above.
row_extractor:
   method: associated  # nearest_band selects the original baseline
   expected_spacing_m: 0.0  # 0 = unknown; set actual measured spacing for this field
   spacing_tolerance_m: 0.10
   association_gate_m: 0.08
   maximum_gap_m: 0.65
   minimum_span_m: 1.0
   maximum_run_width_m: 0.18
   parallel_soft_weight: 0.10
# Opt in only for ordered video frames using capture timestamps, not independent images.
row_tracker:
   enabled: 0
   confirmation_frames: 3
   max_missed_frames: 3
   max_coast_s: 0.35
   max_gap_s: 0.5
   association_gate_m: 0.12
   heading_gate_rad: 0.08
   target_gate_m: 0.15
   target_heading_gate_rad: 0.08
   smoothing_tau_s: 0.10
# Dynamic BEV is opt-in. These are INVALID placeholders, never field calibration.
# Fill measured optical-camera -> vehicle rigid transform, reference pose and
# vertical distance from vehicle origin to the local horizontal ground plane.
dynamic_bev:
   enabled: 0
   calibration_valid: 0
   camera_to_vehicle_rotation: !!opencv-matrix
      rows: 3
      cols: 3
      dt: d
      data: [ 1., 0., 0., 0., 1., 0., 0., 0., 1. ]
   camera_position_vehicle_m: !!opencv-matrix
      rows: 3
      cols: 1
      dt: d
      data: [ 0., 0., 0. ]
   origin_height_m: 0.
   reference_roll_rad: 0.
   reference_pitch_rad: 0.
   max_tilt_rad: 0.35
   max_attitude_age_ms: 50.
   max_reference_error_m: 0.05
