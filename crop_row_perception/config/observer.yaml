crop_row_perception:
  ros__parameters:
    image_topic: /camera/image_raw
    observation_topic: /crop_row/observation
    camera_frame: camera_optical_frame
    # BEV must already be calibrated to this exact vehicle reference point.
    vehicle_frame: base_link
    calibration_id: ""
    model_path: ""
    intrinsic_path: ""
    bev_path: ""
    backend: onnx
    model_width: 640
    model_height: 640
    detection_confidence: 0.25
    navigation_confidence: 0.35
    max_frame_age_ms: 250.0
    # Optional read-only input from the existing GIAVP navigation driver.
    # A validity gate for STATIC BEV, NOT dynamic attitude compensation.
    attitude_gate:
      enabled: false
      pose_topic: /gnss_driver/pose
      pose_frame: odom
      # Set true only after measuring roll/pitch during BEV calibration and
      # verifying the GNSS orientation axes match vehicle_frame on this rig.
      reference_measured: false
      vehicle_axes_confirmed: false
      reference_roll_rad: 0.0
      reference_pitch_rad: 0.0
      # Example limits only; require field validation, not an accuracy guarantee.
      max_delta_rad: 0.035
      max_sample_age_ms: 50.0
    replay: false
    use_sim_time: false
