sim_vehicle:
  ros__parameters:
    # ============================================================
    # spdlog 日志（与其他 ROS 节点保持一致）
    # ============================================================
    # 支持 ~ 和 $VAR 展开；目录不可写时回退到 $ROS_HOME/logs
    # 或 ~/.ros/logs。
    log_dir: "/opt/agri/logs"
    log_file_size_mb: 50
    log_file_count: 10
    log_enable_console: true
    log_level: "info"

    # 车辆几何参数（米）
    wheelbase: 1.521        # 前后轴距 (m)
    wheel_track: 1.306      # 左右轮中心距 (m)
    wheel_radius_m: 0.29    # 车轮半径 (m)
    vehicle_length_m: 1.8   # 车体长度 (m, 不含车轮外伸)
    vehicle_width_m: 1.2    # 车体宽度 (m, 不含车轮外伸)
    vehicle_height_m: 0.5   # 车体高度 (m)

    # 车辆运动限制
    max_speed_m_s: 1.4        # 最大线速度 (m/s); 运行期上限由代码固定为 1.4
    max_plant_steer_deg: 90.0 # 90 度，对应 pi/2 弧度
    wheel_count: 4            # 当前四轮运动学仅支持 4

sim_orchestrator:
  ros__parameters:
    # 编排器使用独立日志文件，避免与 sim_vehicle 进程并发写同一文件。
    log_dir: "/opt/agri/logs"
    log_file_size_mb: 50
    log_file_count: 10
    log_enable_console: true
    log_level: "info"
